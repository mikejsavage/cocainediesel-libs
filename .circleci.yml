version: 2.1

orbs:
  win: circleci/windows@5.0

jobs:
  windows:
    executor: win/default
    steps:
      - checkout
      - run: choco install cmake vulkan-sdk
      - run:
          name: Build Libraries
          command: |
            ./curl_windows.bat
            ./discord_windows.bat
            ./freetype_windows.bat
            ./luau_windows.bat
            ./openal_windows.bat
            ./sdl_windows.bat
            ./tracy_windows.bat
            ./zstd_windows.bat
            Compress-Archive -Path build -DestinationPath build.zip
      - store_artifacts:
          path: build.zip

  macos:
    macos:
      xcode: 15.3.0 # Matches macOS Sonoma environment
    environment:
      ZERO_AR_DATE: "1"
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - checkout
      - run: brew install cmake
      - run:
          name: Build Libraries
          command: |
            ./discord_macos.sh
            ./freetype_macos.sh
            ./luau_macos.sh
            ./openal_macos.sh
            ./sdl_macos.sh
            ./tracy_macos.sh
            ./zstd_macos.sh
            tar --create --file=build.tar build
      - store_artifacts:
          path: build.tar

  linux:
    docker:
      - image: alpine:latest
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            apk add bash make cmake ninja patch
            apk add libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libxscrnsaver-dev libxtst-dev
            apk add wayland-dev wayland-protocols
            apk add mesa-dev
            apk add alsa-lib-dev pulseaudio-dev pipewire-dev
      - run:
          name: Build Libraries
          command: |
            ./curl_linux.sh
            ./discord_linux.sh
            ./freetype_linux.sh
            ./luau_linux.sh
            ./openal_linux.sh
            ./sdl_linux.sh
            ./tracy_linux.sh
            ./zstd_linux.sh
            tar --create --file=build.tar build
      - store_artifacts:
          path: build.tar

workflows:
  build-libs:
    jobs:
      - windows
      - macos
      - linux
